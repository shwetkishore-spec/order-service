# CI/CD pipeline for order-service
# CI  (every push + pull request): lint -> test
# CD  (only on merge to main):     build image -> push to GitHub registry -> update k8s manifest (GitOps)
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write    # lets the pipeline commit the new image tag
  packages: write    # lets it push the image to ghcr.io

jobs:
  test:
    name: CI - lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 app tests --max-line-length=100
      - name: Unit + API tests
        run: pytest -v

  build-and-deploy:
    name: CD - build, publish, release
    needs: test                                   # only runs if CI passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t "$IMAGE" .

      - name: Smoke test the image
        run: |
          docker run -d -p 8080:8080 --name smoke "$IMAGE"
          sleep 3
          curl -sf "http://localhost:8080/total?cart_value=600" | grep '"total":540'

      - name: Push image
        run: docker push "$IMAGE"

      - name: Update Kubernetes manifest with new tag (GitOps)
        run: |
          sed -i "s|image: .*|image: $IMAGE|" k8s/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "deploy: order-service ${GITHUB_SHA::7} [skip ci]"
          git push
